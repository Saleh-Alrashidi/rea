<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>mini-monday</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui/controls.css" />
    <link rel="stylesheet" href="/ui/table.css" />
    <link rel="stylesheet" href="/ui/kanban.css" />
    <link rel="stylesheet" href="/ui/panels.css" />
    <link rel="stylesheet" href="/ui/item-card.css" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Workspace"></aside>
      <div
        id="sidebar-backdrop"
        class="sidebar-backdrop"
        aria-hidden="true"
      ></div>
      <main id="main" class="main">
        <header id="board-header" class="board-header-region"></header>
        <section
          id="board-view"
          class="board-view"
          aria-label="Board"
        ></section>
      </main>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <noscript><p class="noscript">mini-monday needs JavaScript.</p></noscript>
  </body>
</html>
